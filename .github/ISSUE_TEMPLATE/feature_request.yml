name: Feature request
description: Suggest an idea for Metrolist Desktop
labels: [enhancement]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues and didn't find this request.
          required: true
        - label: This is a single feature request.
          required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: What feature you want the app to have? Provide detailed description about what it should look like or where it should be added.
    validations:
      required: true

  - type: textarea
    id: why-is-the-feature-requested
    attributes:
      label: Why do you want this feature?
      description: Describe the problem or limitation that motivates you to want this feature to be added.
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add any other context or screenshots about the feature request here.
      placeholder: |
        Additional details and attachments.
