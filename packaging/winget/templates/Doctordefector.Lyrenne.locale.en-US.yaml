ShortDescription: A free, open source YouTube Music player for your desktop.
Description: |-
  Lyrenne is a native YouTube Music player for Windows and Linux, written in Compose Desktop.
  It is not a browser wrapper: it has its own VLC-based player, local database and sync layer.

  Sign in with your own account and it plays your real library, with two-way sync of liked
  songs, albums, artists and playlists. Synced lyrics, a 10-band equalizer, crossfade,
  downloads, Discord Rich Presence, Last.fm scrobbling, Listen Together rooms and a mini player.

  VLC, ffmpeg and a Java runtime are bundled, so there is nothing else to install. Installed
  through winget, Lyrenne keeps your library, sign-in and settings in %LOCALAPPDATA%\Lyrenne,
  so upgrading or uninstalling the package never touches them.

  Lyrenne is not affiliated with YouTube, Google or Alphabet.
