name: Bug report
description: Something in Metrolist Desktop is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Two things solve most reports before they're filed, so it's worth a look first:

        - **The app won't start.** The usual cause is an install folder inside OneDrive, Dropbox
          or a synced Desktop. Move it to somewhere like `C:\Metrolist` and try again.
        - **Everything is empty after signing in.** An expired YouTube session returns empty
          results instead of an error. Sign out and back in from Settings.

        Both are covered in more detail in the
        [troubleshooting section](https://github.com/Doctordefector/Metrolist-Desktop#troubleshooting).

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I'm on the [latest release](https://github.com/Doctordefector/Metrolist-Desktop/releases/latest) and the bug still happens.
          required: true
        - label: I searched open and closed issues and didn't find this one.
          required: true
        - label: This report is about a single bug.
          required: true
        - label: Metrolist is **not** installed in OneDrive, Dropbox, or a synced Desktop/Documents folder.
          required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: What did you do for the bug to show up?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      placeholder: "This should have happened..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      placeholder: "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: |
        Metrolist writes **`metrolist.log`** next to `Metrolist.exe` on every launch. Attach it
        here, or paste the tail of it. This is by far the most useful thing you can include,
        especially for a crash or a window that never appears.

        You can drag the file straight into this box.
      render: shell

  - type: input
    id: app-version
    attributes:
      label: Metrolist Desktop version
      description: Shown in Settings, and in the release ZIP filename.
      placeholder: "2.9.2"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other (say which below)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - Portable ZIP from the releases page
        - winget
        - Scoop
        - Built from source
    validations:
      required: true

  - type: textarea
    id: sreen-media
    attributes:
      label: Screenshots or screen recordings
      description: Optional, but a picture usually explains a UI bug faster than words. Drop files straight into this box.

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      placeholder: Anything else worth knowing. Antivirus in use, unusual audio hardware, a proxy, a non-English system locale.
