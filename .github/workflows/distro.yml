name: distro

# Branch-only while the install channels are being built; folded into release.yml afterwards.
on:
  push:
    branches: [feat/distro]
  workflow_dispatch:

env:
  SMOKE_URL: https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build portable ZIP
        shell: bash
        run: ./gradlew :desktop:packagePortableZip
      - name: winget manifests from this ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem desktop/build/compose/binaries/main/app/Lyrenne-*-portable.zip | Select-Object -First 1
          ./packaging/winget/New-WingetManifest.ps1 -ZipPath $zip.FullName
      - name: Layout per install location
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem desktop/build/compose/binaries/main/app/Lyrenne-*-portable.zip | Select-Object -First 1).FullName
          function Smoke($root, $expectLayout, $expectData) {
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $root | Out-Null
            Expand-Archive $zip $root
            $p = Start-Process "$root\Lyrenne\Lyrenne.exe" -ArgumentList '--smoke-test',"--smoke-url",$env:SMOKE_URL -Wait -PassThru
            $out = Get-Content "$expectData\smoke-test.txt"
            $out | Write-Host
            if ($p.ExitCode -ne 0) { throw "smoke test failed in $root (exit $($p.ExitCode))" }
            if (-not ($out -match "^layout: $expectLayout$")) { throw "expected layout $expectLayout" }
            if ($expectData -ne "$root\Lyrenne\data" -and (Test-Path "$root\Lyrenne\data")) { throw "data written into the app folder $root" }
            Write-Host "OK: $root -> $expectLayout"
          }
          $managed = "$env:LOCALAPPDATA\Lyrenne"
          Smoke 'C:\portable-test' 'PORTABLE' 'C:\portable-test\Lyrenne\data'
          Smoke "$env:LOCALAPPDATA\Microsoft\WinGet\Packages\Doctordefector.Lyrenne_CI" 'WINGET' $managed
          Smoke "$env:ProgramFiles\Lyrenne" 'PROGRAM_FILES' $managed
      # The real thing: winget installs the manifest, then this build replaces the package files
      # (the released ZIP predates the fix), runs from PATH, and its data must survive uninstall.
      - name: winget install, run, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Scope CurrentUser -Repository PSGallery
            Repair-WinGetPackageManager -Latest -Force
          }
          winget --version
          winget settings --enable LocalManifestFiles
          # Runner images ship with Defender switched off, and winget reads the failed archive scan as
          # "malware detected". On a real PC the scan runs; here it is skipped.
          winget settings --enable LocalArchiveMalwareScanOverride
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Lyrenne" -ErrorAction SilentlyContinue
          $v = (Select-String -Path desktop/build.gradle.kts -Pattern 'val lyrenneVersion = "([^"]+)"').Matches[0].Groups[1].Value
          # Rehearsal against the last published release: it exists, so the URL and hash resolve.
          $rel = (Invoke-RestMethod https://api.github.com/repos/Doctordefector/Lyrenne/releases/latest).tag_name.TrimStart('v')
          ./packaging/winget/New-WingetManifest.ps1 -Version $rel -SkipZipCheck -OutDir "$env:RUNNER_TEMP/wg"
          winget install --manifest "$env:RUNNER_TEMP/wg/manifests/d/Doctordefector/Lyrenne/$rel" --accept-package-agreements --accept-source-agreements --disable-interactivity --ignore-local-archive-malware-scan
          if ($LASTEXITCODE -ne 0) { throw "winget install failed ($LASTEXITCODE)" }
          $pkg = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory | Where-Object Name -like 'Doctordefector.Lyrenne_*' | Where-Object Name -ne 'Doctordefector.Lyrenne_CI' | Select-Object -First 1
          Write-Host "Package folder: $($pkg.FullName)"
          $env:Path = [Environment]::GetEnvironmentVariable('Path','User') + ';' + [Environment]::GetEnvironmentVariable('Path','Machine')
          $exe = (Get-Command lyrenne).Source
          Write-Host "lyrenne on PATH: $exe"
          # Swap in this build.
          Expand-Archive (Get-ChildItem desktop/build/compose/binaries/main/app/Lyrenne-*-portable.zip)[0].FullName "$env:RUNNER_TEMP/new"
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP/new/Lyrenne/*" "$($pkg.FullName)\Lyrenne\"
          $p = Start-Process $exe -ArgumentList '--smoke-test' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\Lyrenne\smoke-test.txt" | Write-Host
          if ($p.ExitCode -ne 0) { throw "smoke test from PATH failed" }
          if (-not (Select-String "$env:LOCALAPPDATA\Lyrenne\smoke-test.txt" -Pattern '^layout: WINGET$')) { throw 'not detected as winget' }
          # --force: the package exe was swapped for this build, so its hash no longer matches the install record.
          winget uninstall --id Doctordefector.Lyrenne --force --disable-interactivity
          if (Test-Path $pkg.FullName) { throw 'package folder still there after uninstall' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Lyrenne\lyrenne.db")) { throw 'library did not survive uninstall' }
          Write-Host 'OK: uninstall removed the package and kept the library'
      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: packaging/winget/out/manifests/

  appimage:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:createDistributable
      - name: Build AppImage
        run: |
          V=$(grep -oP 'val lyrenneVersion = "\K[^"]+' desktop/build.gradle.kts)
          docker run --rm -v "$PWD:/src" -w /src -e LYRENNE_VERSION=$V -e LYRENNE_SMOKE_MEDIA=1 debian:bookworm sh packaging/appimage/build-appimage.sh
          sudo chown -R "$(id -u):$(id -g)" dist build
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/smoke.*

  # The AppImage on clean distros: no VLC anywhere, only what any desktop has (X, fonts, a
  # sound server). It must load its own libVLC, play a file, stream over HTTPS, and open a window.
  appimage-test:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, image: "ubuntu:22.04" }
          - { runner: ubuntu-latest, arch: x86_64, image: "ubuntu:24.04" }
          - { runner: ubuntu-latest, arch: x86_64, image: "debian:bookworm" }
          - { runner: ubuntu-latest, arch: x86_64, image: "fedora:latest" }
          - { runner: ubuntu-latest, arch: x86_64, image: "archlinux:latest" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, image: "ubuntu:22.04" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, image: "ubuntu:24.04" }
          - { runner: ubuntu-24.04-arm, arch: aarch64, image: "fedora:latest" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
      - name: A desktop's basics, without VLC
        run: |
          # What every desktop has and the AppImage leaves to the host: X11 client libraries,
          # fontconfig, CA certificates, a sound server. Containers start without them.
          if command -v apt-get >/dev/null; then
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends               ca-certificates pulseaudio xvfb xauth fontconfig fonts-dejavu-core libxtst6 libxi6 libxrender1 libxext6 libgl1 procps >/dev/null
          elif command -v dnf >/dev/null; then
            dnf install -y -q ca-certificates pulseaudio xorg-x11-server-Xvfb xorg-x11-xauth fontconfig dejavu-sans-fonts               libXtst libXi libXrender libXext mesa-libGL procps-ng which
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --quiet ca-certificates pulseaudio xorg-server-xvfb xorg-xauth fontconfig ttf-dejavu               libxtst libxi libxrender libxext libglvnd procps-ng which
          fi
          if ldconfig -p | grep libvlc; then echo "::error::VLC is installed, the test would prove nothing"; exit 1; fi
      - name: Smoke test (bundled libVLC plays a file and an HTTPS stream)
        run: |
          # Containers run as root, which a per-user PulseAudio refuses; system mode serves root.
          pulseaudio --system --daemonize --disallow-exit --exit-idle-time=-1 2>/dev/null || true
          export PULSE_SERVER=unix:/var/run/pulse/native
          chmod +x Lyrenne-*.AppImage
          M="file://$PWD/smoke"
          APPIMAGE_EXTRACT_AND_RUN=1 ./Lyrenne-*.AppImage --smoke-test --smoke-url "$SMOKE_URL"             --smoke-url "$M.m4a" --smoke-url "$M.webm" --smoke-url "$M.mp3" --smoke-url "$M.flac" | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          grep -q "layout: XDG" smoke.log
          grep -q "libvlc file: /tmp/" smoke.log
          grep -aq "failed to create audio output" smoke.log && echo "::warning::no sound server reachable, playback ran without audio output" || true
      - name: Window opens with the bundled libVLC
        run: |
          DATA="$(getent passwd "$(id -u)" | cut -d: -f6)/.local/share/lyrenne"
          mkdir -p "$DATA"
          echo "onboardingCompleted=true" > "$DATA/preferences.properties"
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 xvfb-run -a ./Lyrenne-*.AppImage > stdout.log 2>&1 || true
          cat stdout.log "$DATA/lyrenne.log" > run.log || true
          tail -60 run.log
          grep -q "Using bundled VLC" run.log
          grep -q "VLC initialized successfully" run.log
          ! grep -aE "Exception in thread|Fatal|FATAL" run.log

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build distributable
        run: ./gradlew -Pci :desktop:test :desktop:createDistributable
      - name: Package .deb, .rpm and .tar.gz for arm64
        run: |
          export LYRENNE_VERSION=$(grep -oP 'val lyrenneVersion = "\K[^"]+' desktop/build.gradle.kts)
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update -qq && sudo apt-get install -y -qq nfpm
          mkdir -p dist
          sed 's/^arch: amd64$/arch: arm64/' packaging/linux/nfpm.yaml > nfpm-arm64.yaml
          nfpm package -f nfpm-arm64.yaml -p deb -t dist/
          nfpm package -f nfpm-arm64.yaml -p rpm -t dist/
          tar -C desktop/build/compose/binaries/main/app -czf "dist/lyrenne-$LYRENNE_VERSION-linux-aarch64.tar.gz" Lyrenne
          ls -l dist
      - name: Install .deb and smoke-run
        run: |
          sudo apt-get install -y -qq ./dist/*.deb xvfb pulseaudio dbus-x11 >/dev/null
          dbus-run-session -- sh -c 'pulseaudio -D --exit-idle-time=-1; lyrenne --smoke-test --smoke-url "$SMOKE_URL"' | tee smoke.log
          grep -q "SMOKE OK" smoke.log
          grep -q "mpris: org.mpris.MediaPlayer2.Lyrenne" smoke.log
          mkdir -p ~/.local/share/lyrenne
          echo "onboardingCompleted=true" > ~/.local/share/lyrenne/preferences.properties
          timeout 60 xvfb-run -a lyrenne > stdout.log 2>&1 || true
          cat stdout.log ~/.local/share/lyrenne/lyrenne.log > run.log
          tail -40 run.log
          grep -q "VLC initialized successfully" run.log
          ! grep -aE "Exception in thread|Fatal|FATAL" run.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/

  fedora-arm64:
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist
      - name: Install .rpm and smoke-run
        run: |
          dnf install -y -q ./dist/*.rpm pulseaudio
          pulseaudio -D --exit-idle-time=-1 2>/dev/null || true
          lyrenne --smoke-test | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:createDistributable
      - name: Install flatpak-builder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder xvfb pulseaudio dbus-x11 ffmpeg >/dev/null
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build from this commit's distributable
        run: |
          tar -C desktop/build/compose/binaries/main/app -czf packaging/flatpak/lyrenne-local.tar.gz Lyrenne
          echo '[{"type": "archive", "path": "lyrenne-local.tar.gz", "dest": "lyrenne"}]' > packaging/flatpak/lyrenne-sources.json
          flatpak-builder --user --install-deps-from=flathub --install --force-clean --repo=repo \
            --mirror-screenshots-url=https://dl.flathub.org/media/ \
            build packaging/flatpak/io.github.doctordefector.Lyrenne.yml
          # What Flathub users get automatically (autodownload); a local install does not pull it.
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform.ffmpeg-full//26.08
          flatpak build-bundle repo lyrenne.flatpak io.github.doctordefector.Lyrenne
          ls -l lyrenne.flatpak
      - name: Lint (Flathub's linter)
        continue-on-error: true
        run: |
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          git checkout packaging/flatpak/lyrenne-sources.json
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest packaging/flatpak/io.github.doctordefector.Lyrenne.yml || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo || true
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream packaging/flatpak/io.github.doctordefector.Lyrenne.metainfo.xml || true
      - name: Smoke test inside the sandbox
        run: |
          export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/run/user/$(id -u)}
          # ~/Music/Lyrenne is the only home folder the sandbox sees, so the test files go there.
          mkdir -p ~/Music/Lyrenne
          for f in m4a:aac webm:libopus mp3:libmp3lame flac:flac; do
            ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=440:duration=8" -c:a "${f#*:}" "$HOME/Music/Lyrenne/smoke.${f%%:*}"
          done
          M="file://$HOME/Music/Lyrenne/smoke"
          dbus-run-session -- sh -c "pulseaudio -D --exit-idle-time=-1; flatpak run io.github.doctordefector.Lyrenne --smoke-test --smoke-url '$SMOKE_URL' --smoke-url '$M.m4a' --smoke-url '$M.webm' --smoke-url '$M.mp3' --smoke-url '$M.flac'" 2>&1 | tee smoke.log
          ! grep -aq "stale plugins cache" smoke.log
          grep -q "SMOKE OK" smoke.log
          grep -q "layout: XDG" smoke.log
          grep -q "data dir: $HOME/.var/app/io.github.doctordefector.Lyrenne/data/lyrenne" smoke.log
          grep -q "update route: Update with: flatpak update" smoke.log
          grep -q "mpris: org.mpris.MediaPlayer2.Lyrenne" smoke.log
          flatpak run --command=sh io.github.doctordefector.Lyrenne -c 'command -v notify-send xdg-open; ls /app/lib/vlc/plugins | head -50; ls /app/lib/vlc/plugins/plugins.dat'
      - name: Window opens
        run: |
          DATA=$HOME/.var/app/io.github.doctordefector.Lyrenne/data/lyrenne
          mkdir -p "$DATA"
          echo "onboardingCompleted=true" > "$DATA/preferences.properties"
          timeout 60 xvfb-run -a flatpak run io.github.doctordefector.Lyrenne > stdout.log 2>&1 || true
          cat stdout.log "$DATA/lyrenne.log" > run.log || true
          tail -60 run.log
          grep -q "Using bundled VLC" run.log
          grep -q "VLC initialized successfully" run.log
          ! grep -aE "Exception in thread|Fatal|FATAL" run.log
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: lyrenne.flatpak
