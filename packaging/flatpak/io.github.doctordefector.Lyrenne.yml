# Flathub manifest for Lyrenne. Build locally with:
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean build packaging/flatpak/io.github.doctordefector.Lyrenne.yml
# Submission steps: packaging/README.md, "Flathub".
app-id: io.github.doctordefector.Lyrenne
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lyrenne

finish-args:
  - --share=network
  # The window is AWT, which only speaks X11 (XWayland on a Wayland session).
  - --share=ipc
  - --socket=x11
  # Hardware-accelerated drawing (Skia over OpenGL).
  - --device=dri
  # Playback; PipeWire desktops serve this through pipewire-pulse.
  - --socket=pulseaudio
  # The default downloads folder (~/Music/Lyrenne), and nothing else of the home folder.
  - --filesystem=xdg-music/Lyrenne:create
  # Media keys and desktop media controls.
  - --own-name=org.mpris.MediaPlayer2.Lyrenne
  # Song-change and update notifications (notify-send).
  - --talk-name=org.freedesktop.Notifications
  # Discord Rich Presence: Discord's IPC socket, native or Flatpak Discord.
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

# AAC streams decode through the runtime's full FFmpeg; Opus needs nothing extra.
add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
    autodownload: true
    autodelete: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'
cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

modules:
  # libVLC only: no player UI, no video output, no Lua, no D-Bus control (which would register
  # a second MPRIS player named "vlc" next to Lyrenne's own).
  - name: vlc
    config-opts:
      - BUILDCC=/usr/bin/gcc -std=gnu99
      - --disable-vlc
      - --disable-qt
      - --disable-skins2
      - --disable-lua
      - --disable-a52
      - --disable-dbus
      - --disable-xcb
      - --disable-wayland
      - --disable-vdpau
      - --disable-libva
      - --disable-ncurses
      - --disable-avahi
      - --disable-chromecast
      - --disable-update-check
      - --disable-nls
    cleanup:
      - /bin
      - /share/applications
      - /share/icons
      - /share/kde4
      - /share/macosx
      - /share/metainfo
      - /share/vlc/lua
    post-install:
      # The plugin cache, so libVLC does not scan every plugin on each start. The patch makes it
      # ignore mtimes, which ostree resets when the app is installed.
      - rm -f /app/lib/vlc/plugins/plugins.dat
      - /app/lib/vlc/vlc-cache-gen /app/lib/vlc/plugins
    sources:
      - type: archive
        url: https://download.videolan.org/videolan/vlc/3.0.24/vlc-3.0.24.tar.xz
        sha256: e7cab503d1d7d5849b89d2cf0e1ee60d0ef6d012407791b644b9cfc0cc225fdf
        x-checker-data:
          type: anitya
          project-id: 6504
          versions:
            '>=': '3'
            <: '4'
          url-template: https://download.videolan.org/videolan/vlc/$version/vlc-$version.tar.xz
      - type: patch
        path: vlc-ignore-time-for-cache.patch

  # The release's Linux build (app plus its own Java runtime), as attached to each GitHub release.
  - name: lyrenne
    buildsystem: simple
    build-commands:
      - cp -a lyrenne /app/lib/lyrenne
      - install -Dm755 lyrenne.sh /app/bin/lyrenne
      - install -Dm644 io.github.doctordefector.Lyrenne.desktop -t /app/share/applications
      - install -Dm644 io.github.doctordefector.Lyrenne.metainfo.xml -t /app/share/metainfo
      - install -Dm644 lyrenne/lib/Lyrenne.png /app/share/icons/hicolor/512x512/apps/io.github.doctordefector.Lyrenne.png
    sources:
      - lyrenne-sources.json
      - type: file
        path: lyrenne.sh
      - type: file
        path: io.github.doctordefector.Lyrenne.desktop
      - type: file
        path: io.github.doctordefector.Lyrenne.metainfo.xml
