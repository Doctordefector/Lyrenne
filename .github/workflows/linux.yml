name: linux

on:
  push:
    branches: [main, linux-port, linux-e2e]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # -Pci skips the *SmokeTest classes, which need real YouTube / OS APIs.
      - name: Test and build distributable
        run: ./gradlew -Pci :desktop:test :desktop:createDistributable

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Package .deb and .rpm
        run: |
          export LYRENNE_VERSION=$(grep -oP 'val lyrenneVersion = "\K[^"]+' desktop/build.gradle.kts)
          mkdir -p dist
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/

      # Phase 1 exit check: the package installs with its VLC dependency, the app starts under X,
      # finds the distro libvlc, and keeps its data in ~/.local/share/lyrenne. Onboarding is
      # skipped because it blocks on a sign-in a runner cannot do.
      - name: Install .deb and smoke-run
        run: |
          sudo apt-get install -y ./dist/*.deb xvfb
          mkdir -p ~/.local/share/lyrenne
          echo "onboardingCompleted=true" > ~/.local/share/lyrenne/preferences.properties
          timeout 60 xvfb-run -a lyrenne > stdout.log 2>&1 || true
          cat stdout.log ~/.local/share/lyrenne/lyrenne.log > run.log
          tail -80 run.log
          grep -q "VLC initialized successfully" run.log
          test -f ~/.local/share/lyrenne/lyrenne.db
          ! grep -E "Exception in thread|Fatal|FATAL" run.log

      - uses: actions/upload-artifact@v4
        with:
          name: lyrenne-linux
          path: dist/

  # Same install-and-launch check on Fedora, from the .rpm built above. Fedora's own repos carry
  # VLC, so the rpm's `vlc` dependency resolves without RPM Fusion.
  fedora:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lyrenne-linux
          path: dist
      - name: Install .rpm and smoke-run
        run: |
          dnf install -y ./dist/*.rpm xorg-x11-server-Xvfb xorg-x11-xauth which
          # In a container $HOME is /github/home, but Java takes user.home from passwd (/root).
          DATA="$(getent passwd "$(id -u)" | cut -d: -f6)/.local/share/lyrenne"
          mkdir -p "$DATA"
          echo "onboardingCompleted=true" > "$DATA/preferences.properties"
          timeout 60 xvfb-run -a lyrenne > stdout.log 2>&1 || true
          cat stdout.log "$DATA/lyrenne.log" > run.log || true
          tail -80 run.log
          grep -q "VLC initialized successfully" run.log
          test -f "$DATA/lyrenne.db"
          ! grep -E "Exception in thread|Fatal|FATAL" run.log

  # Phase 1 playback criteria against Ubuntu's real VLC: a local file plays, EQ / speed /
  # normalize / skip-silence apply, MPRIS is visible to and controllable from playerctl.
  # Streaming itself needs a signed-in session, so instead this checks the distro VLC carries
  # every plugin a YouTube stream goes through (HTTPS, adaptive streaming, Opus and AAC).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install VLC, PulseAudio, playerctl
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc pulseaudio playerctl dbus-x11
      - name: VLC carries the streaming plugins
        run: |
          P=$(dirname "$(find /usr/lib -name libhttps_plugin.so | head -1)")/..
          for m in access/libhttps_plugin.so demux/libadaptive_plugin.so demux/libmp4_plugin.so \
                   demux/libmkv_plugin.so codec/libopus_plugin.so codec/libavcodec_plugin.so \
                   audio_filter/libnormvol_plugin.so audio_filter/libcompressor_plugin.so \
                   audio_filter/libequalizer_plugin.so; do
            test -f "$P/$m" && echo "ok $m" || { echo "MISSING $m"; exit 1; }
          done
      - name: Playback and MPRIS end to end
        run: |
          dbus-run-session -- bash -c '
            pulseaudio -D --exit-idle-time=-1 --system=false
            LYRENNE_LINUX_E2E=1 ./gradlew -Pci :desktop:test --tests "*LinuxPlaybackE2ETest" -i | grep -E "LinuxPlaybackE2ETest|PASSED|FAILED|SKIPPED|initialized|timed out" '
          test -f desktop/build/test-results/test/TEST-com.lyrenne.desktop.playback.LinuxPlaybackE2ETest.xml
          grep -q 'skipped="0"' desktop/build/test-results/test/TEST-com.lyrenne.desktop.playback.LinuxPlaybackE2ETest.xml
          grep -q 'failures="0" errors="0"' desktop/build/test-results/test/TEST-com.lyrenne.desktop.playback.LinuxPlaybackE2ETest.xml
