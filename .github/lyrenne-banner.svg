<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Lyrenne: a YouTube Music player for Windows">
  <defs>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5c31"/>
      <stop offset="55%" stop-color="#A37C43"/>
      <stop offset="100%" stop-color="#d8b57c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A37C43"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
    <g id="bannerBody">
      <path d="M203 352 C 130 306 122 210 164 134 L 187 145 C 152 214 160 298 222 340 Z"/>
      <path d="M309 352 C 382 306 390 210 348 134 L 325 145 C 360 214 352 298 290 340 Z"/>
      <path d="M147 133 L365 133 L373 146 L365 161 L147 161 L139 146 Z"/>
      <path d="M196 330 C 220 344 292 344 316 330 C 314 384 292 404 256 404 C 220 404 198 384 196 330 Z"/>
    </g>
  </defs>

  <rect width="1280" height="320" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#333333"/>

  <!--
    App tile: the same lyre as docs/images/logo.svg, scaled from its 512 grid to 112.
    Gold is drawn as one silhouette pass and then covered by unstroked white, so the arms
    do not show a seam where they pass under the yoke and into the soundbox. Flat fills
    rather than the logo's gradients, which are invisible at 112px.
  -->
  <g transform="translate(80 104)">
    <rect width="112" height="112" rx="26" fill="#0a0a0a" stroke="url(#accent)" stroke-width="3"/>
    <g transform="scale(0.21875)" stroke="none">
      <g fill="#ffffff">
        <rect x="216" y="146" width="8" height="206"/>
        <rect x="236" y="146" width="8" height="206"/>
        <rect x="256" y="146" width="8" height="206"/>
        <rect x="276" y="146" width="8" height="206"/>
        <rect x="296" y="146" width="8" height="206"/>
      </g>
      <use href="#bannerBody" fill="#A37C43" stroke="#A37C43" stroke-width="11" stroke-linejoin="round"/>
      <use href="#bannerBody" fill="#ffffff"/>
    </g>
  </g>

  <g font-family="Space Mono, Cascadia Mono, Consolas, DejaVu Sans Mono, monospace">
    <text x="240" y="146" font-size="44" letter-spacing="11" fill="#ffffff">LYRENNE</text>
    <text x="243" y="192" font-size="19" letter-spacing="5.5" fill="url(#accent)">MUSIC PLAYER</text>
    <rect x="245" y="212" width="300" height="1" fill="url(#rule)"/>
    <text x="243" y="246" font-size="14" letter-spacing="3" fill="#777777">YOUTUBE MUSIC FOR WINDOWS</text>
    <text x="243" y="272" font-size="11" letter-spacing="2.6" fill="#555555">PORTABLE &#183; NO INSTALLER &#183; GPL-3.0</text>
  </g>

  <!-- waveform -->
  <g fill="url(#accent)">
    <rect x="960"  y="176" width="8" height="48"  rx="1"/>
    <rect x="984"  y="146" width="8" height="108" rx="1"/>
    <rect x="1008" y="106" width="8" height="188" rx="1"/>
    <rect x="1032" y="160" width="8" height="80"  rx="1"/>
    <rect x="1056" y="72"  width="8" height="256" rx="1" opacity="0.75"/>
    <rect x="1080" y="130" width="8" height="140" rx="1"/>
    <rect x="1104" y="92"  width="8" height="216" rx="1" opacity="0.8"/>
    <rect x="1128" y="164" width="8" height="72"  rx="1"/>
    <rect x="1152" y="118" width="8" height="164" rx="1"/>
    <rect x="1176" y="152" width="8" height="96"  rx="1"/>
    <rect x="1200" y="98"  width="8" height="204" rx="1" opacity="0.7"/>
  </g>
</svg>
