name: linux

on:
  push:
    branches: [main, linux-port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # -Pci skips the *SmokeTest classes, which need real YouTube / OS APIs.
      - name: Test and build distributable
        run: ./gradlew -Pci :desktop:test :desktop:createDistributable

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Package .deb and .rpm
        run: |
          export LYRENNE_VERSION=$(grep -oP 'val lyrenneVersion = "\K[^"]+' desktop/build.gradle.kts)
          mkdir -p dist
          nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
          nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/

      # Phase 1 exit check: the package installs with its VLC dependency, the app starts under X,
      # finds the distro libvlc, and keeps its data in ~/.local/share/lyrenne. Onboarding is
      # skipped because it blocks on a sign-in a runner cannot do.
      - name: Install .deb and smoke-run
        run: |
          sudo apt-get install -y ./dist/*.deb xvfb
          mkdir -p ~/.local/share/lyrenne
          echo "onboardingCompleted=true" > ~/.local/share/lyrenne/preferences.properties
          timeout 60 xvfb-run -a lyrenne > stdout.log 2>&1 || true
          cat stdout.log ~/.local/share/lyrenne/lyrenne.log > run.log
          tail -80 run.log
          grep -q "VLC initialized successfully" run.log
          test -f ~/.local/share/lyrenne/lyrenne.db
          ! grep -E "Exception in thread|Fatal|FATAL" run.log

      - uses: actions/upload-artifact@v4
        with:
          name: lyrenne-linux
          path: dist/
